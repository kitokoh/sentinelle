# Alembic configuration — Sentinelle backend (issue #4).
# The database URL is never stored here: it is read from app.core.config
# (env var DATABASE_URL / .env) by alembic/env.py.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os
# Timestamped revision filenames keep `ls versions/` chronologically readable.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
