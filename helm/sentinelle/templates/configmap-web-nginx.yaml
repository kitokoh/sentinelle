{{/*
Configuration nginx du frontend.

POURQUOI ce fichier existe : l'image web embarque un nginx.conf qui proxifie
`/api/` vers `http://api:8000` — le nom du service docker-compose. Dans un
cluster Kubernetes ce nom n'existe pas : le Service de l'API s'appelle
`<release>-<charte>-api`. Sans cette surcharge, le frontend démarrerait mais
renverrait systématiquement des 502 sur /api.

La conf est montée en `subPath` sur /etc/nginx/conf.d/default.conf ; un subPath
n'est pas rafraîchi à chaud, d'où l'annotation `checksum/nginx-config` posée sur
le Deployment du web : modifier la conf déclenche bien un rollout.

Alternative sans surcharge : renommer le Service de l'API en `api` — rejeté, car
cela interdirait deux releases Sentinelle dans un même namespace.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinelle.nginxConfigMapName" . }}
  labels:
    {{- include "sentinelle.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy API : /api/* -> http://{{ include "sentinelle.componentName" (dict "root" . "component" "api") }}:{{ .Values.api.service.port }}/api/*
        location /api/ {
            proxy_pass http://{{ include "sentinelle.componentName" (dict "root" . "component" "api") }}:{{ .Values.api.service.port }}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Les rapports PDF (#15) peuvent être longs à produire.
            proxy_read_timeout 120s;
        }

        # SPA : toutes les routes applicatives retombent sur index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Assets fingerprintés : cache agressif.
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
