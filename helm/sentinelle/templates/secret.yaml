{{/*
Secret des valeurs sensibles.

Deux modes, exclusifs :

  * `existingSecret` non vide (défaut) : la charte NE crée RIEN et référence un
    Secret géré hors d'elle (Vault, External Secrets, SealedSecret, ou
    `kubectl create secret`). C'est le mode production : le cycle de vie du
    secret n'est pas celui de la release Helm, et son contenu ne transite jamais
    par values.yaml.

  * `existingSecret` vide : la charte génère le Secret depuis `secret.*` et
    `postgresql.password`, qui deviennent obligatoires (`required`). Mode
    développement / démonstration uniquement — `helm get values` afficherait
    alors les valeurs en clair, d'où l'interdiction en production.

Clés attendues dans un Secret externe (toutes optionnelles sauf les deux
premières, cf. `optional: true` dans _helpers.tpl) :
  postgresql-password, jwt-secret, oidc-client-secret, field-encryption-key,
  metrics-token, misp-api-key, otx-api-key
*/}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinelle.secretName" . }}
  labels:
    {{- include "sentinelle.labels" . | nindent 4 }}
  annotations:
    # Marqueur explicite : ce Secret est né avec la release et disparaîtra avec
    # elle. Le signaler évite qu'on le prenne pour une source de vérité.
    sentinelle.io/managed-by-chart: "true"
type: Opaque
stringData:
  # `required` plutôt qu'une valeur par défaut : mieux vaut un rendu qui échoue
  # bruyamment qu'un déploiement silencieusement protégé par un secret connu.
  postgresql-password: {{ required "postgresql.password est requis quand existingSecret est vide (hors développement, préférez un Secret externe)" .Values.postgresql.password | quote }}
  jwt-secret: {{ required "secret.jwtSecret est requis quand existingSecret est vide (hors développement, préférez un Secret externe)" .Values.secret.jwtSecret | quote }}
  {{- with .Values.secret.oidcClientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.fieldEncryptionKey }}
  field-encryption-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.metricsToken }}
  metrics-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.mispApiKey }}
  misp-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.otxApiKey }}
  otx-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
