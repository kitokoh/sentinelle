{{/*
Compte de service commun aux trois workloads.

Un compte dédié (plutôt que `default`) rend possible une policy RBAC / un
workload identity propre à Sentinelle, et surtout évite d'hériter partout des
droits attachés au compte `default` du namespace. `automount: false` par défaut :
l'application n'appelle pas l'API Kubernetes, donc aucun jeton n'a besoin d'être
exposé dans le pod.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinelle.serviceAccountName" . }}
  labels:
    {{- include "sentinelle.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
