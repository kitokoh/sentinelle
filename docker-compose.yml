services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinelle
      # Jamais en clair dans le fichier : la valeur vient de l'environnement ou du
      # magasin de secrets (#17). Le defaut n'existe que pour la demonstration locale.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelle}
      POSTGRES_DB: sentinelle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelle:sentinelle@db:5432/sentinelle
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      ENV: production
      # Politique de rétention (#5) : 0 désactive la purge.
      RETENTION_DAYS: 90
      # Renseignement (#6-#8) — déposer les secrets dans un .env ou un gestionnaire.
      # MISP_URL: https://misp.example.org
      # MISP_API_KEY: …
      # OTX_API_KEY: …
      CERT_FEEDS: CERT-FR=https://www.cert.ssi.gouv.fr/feed/
      # SSO / OIDC (#14) — sans les trois premières, l'authentification locale
      # reste le seul chemin et le bouton SSO n'apparaît pas.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/sentinelle}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sentinelle}
      OIDC_CLIENT_SECRET: ${SENTINELLE_CLIENT_SECRET:-not-configured-change-me}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/api/auth/oidc/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker   # image dédiée, contient nmap
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelle:sentinelle@db:5432/sentinelle
      REDIS_URL: redis://redis:6379
      # Flux EVE partagé avec le capteur (#1). Absent du conteneur tant que le
      # profil `lab` n'est pas démarré : l'ingestion se contente de sauter le
      # cycle, elle ne tombe jamais en erreur.
      SURICATA_EVE_PATH: /var/log/suricata/eve.json
      RETENTION_DAYS: 90
      # Renseignement (#6-#8) : mêmes valeurs que l'API.
      # MISP_URL: https://misp.example.org
      # MISP_API_KEY: …
      # OTX_API_KEY: …
      CERT_FEEDS: CERT-FR=https://www.cert.ssi.gouv.fr/feed/
    volumes:
      - suricata-logs:/var/log/suricata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Capteur réseau du lab (#1). Démarrer avec : docker compose --profile lab up -d
  # `network_mode: host` est requis pour voir le trafic de l'hôte ; SURICATA_IFACE
  # permet de choisir l'interface (défaut : eth0).
  sensor:
    image: jasonish/suricata:7.0
    profiles: ["lab"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: -i ${SURICATA_IFACE:-eth0} -l /var/log/suricata
    volumes:
      - suricata-logs:/var/log/suricata
    healthcheck:
      test: ["CMD-SHELL", "pgrep suricata >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Fournisseur d'identité SSO (#14). Démarrer avec :
  #   SENTINELLE_CLIENT_SECRET=… docker compose --profile sso up -d
  # Le secret du client n'est PAS écrit dans le realm : il est injecté par
  # variable d'environnement (``${env.SENTINELLE_CLIENT_SECRET}``), ce qui évite
  # de versionner un secret — voir l'issue #17.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-change-me-admin}
      SENTINELLE_CLIENT_SECRET: ${SENTINELLE_CLIENT_SECRET:-not-configured-change-me}
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Supervision (#19). Démarrer avec : docker compose --profile monitoring up -d
  # Prometheus collecte /metrics, Grafana affiche le tableau de bord versionné.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  web:
    build: ./frontend                 # nginx sert le build + proxifie /api
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  # Journal EVE JSON : écrit par `sensor`, lu par `worker`.
  suricata-logs:
  prometheus-data:
  grafana-data:
