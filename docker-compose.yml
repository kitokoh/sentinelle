services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinelle
      POSTGRES_PASSWORD: sentinelle
      POSTGRES_DB: sentinelle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelle:sentinelle@db:5432/sentinelle
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker   # image dédiée, contient nmap
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinelle:sentinelle@db:5432/sentinelle
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend                 # nginx sert le build + proxifie /api
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
