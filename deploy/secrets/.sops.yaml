# Règles de chiffrement SOPS — Sentinelle (v0.6, issue #17)
#
# age est utilisé comme porte-clés : une clé privée reste sur le poste de
# l'opérateur (jamais dans le dépôt), seule la clé PUBLIQUE est déclarée ici.
#
# Remplacer le destinataire ci-dessous par votre clé publique
# (`age-keygen -o ~/.config/sops/age/keys.txt` puis recopier la ligne `# public key:`).
#
# Plusieurs destinataires sont possibles et recommandés : une clé par
# administrateur, plus une clé de secours hors ligne. Perdre la seule clé
# privée, c'est perdre définitivement les secrets chiffrés.

creation_rules:
  # Tous les fichiers `.enc.yaml` / `.enc.env` de ce répertoire.
  - path_regex: deploy/secrets/.*\.enc\.(yaml|env)$
    # Le fichier déchiffré ne doit jamais atterrir dans le dépôt.
    filename_regex: .*\.enc\.(yaml|env)$
    age: age1REMPLACER_PAR_VOTRE_CLE_PUBLIQUE
    # `encrypted_regex` limite le chiffrement aux valeurs : les NOMS de variables
    # restent lisibles, ce qui rend un `git diff` exploitable en revue.
    encrypted_regex: "^(jwt_secret|field_encryption_key|postgres_password|misp_api_key|otx_api_key|oidc_client_secret|metrics_token|grafana_admin_password)$"
